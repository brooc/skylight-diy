name: daymark-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${DAYMARK_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: daymark
      POSTGRES_DB: daymark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymark -d daymark"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${DAYMARK_ENV_FILE:-.env}
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "150"
      WATCHPACK_POLLING: "true"
    working_dir: /workspace
    command:
      ["sh", "-c", "CI=true pnpm install --frozen-lockfile && pnpm dev:docker"]
    ports:
      - "${DAYMARK_BIND_ADDRESS:-0.0.0.0}:${DAYMARK_HTTP_PORT:-8080}:5173"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store

volumes:
  postgres_data:
    name: ${DAYMARK_POSTGRES_VOLUME:-daymark-local-data}
    external: ${DAYMARK_POSTGRES_EXTERNAL:-false}
  node_modules:
  pnpm_store:
