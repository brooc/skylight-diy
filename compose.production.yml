name: daymark-production

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${DAYMARK_ENV_FILE:-.env.production}
    environment:
      POSTGRES_USER: daymark
      POSTGRES_DB: daymark
    volumes:
      - daymark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymark -d daymark"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DAYMARK_API_IMAGE:-ghcr.io/brooc/daymark-api}:${DAYMARK_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - ${DAYMARK_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ${DAYMARK_UPDATE_HOST_DIR:-./.daymark-update}:/var/lib/daymark/update
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 10

  web:
    image: ${DAYMARK_WEB_IMAGE:-ghcr.io/brooc/daymark-web}:${DAYMARK_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DAYMARK_BIND_ADDRESS:-0.0.0.0}:${DAYMARK_HTTP_PORT:-8080}:8080"

volumes:
  daymark_postgres_data:
    name: ${DAYMARK_POSTGRES_VOLUME:-daymark-production-data}
