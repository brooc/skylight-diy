name: Publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  android-display:
    name: Build signed Android display app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYMARK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/daymark-release.p12"

      - name: Build and verify signed APK
        env:
          DAYMARK_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/daymark-release.p12
          DAYMARK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DAYMARK_ANDROID_KEYSTORE_PASSWORD }}
          DAYMARK_ANDROID_KEY_ALIAS: ${{ secrets.DAYMARK_ANDROID_KEY_ALIAS }}
          DAYMARK_ANDROID_KEY_PASSWORD: ${{ secrets.DAYMARK_ANDROID_KEY_PASSWORD }}
          DAYMARK_ANDROID_VERSION_CODE: ${{ github.run_number }}
          DAYMARK_ANDROID_VERSION_NAME: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          gradle --project-dir apps/android-display testReleaseUnitTest assembleRelease --no-daemon
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose apps/android-display/app/build/outputs/apk/release/app-release.apk
          cp apps/android-display/app/build/outputs/apk/release/app-release.apk daymark-display.apk
          sha256sum daymark-display.apk > daymark-display.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: daymark-android-display
          path: |
            daymark-display.apk
            daymark-display.apk.sha256
          retention-days: 30

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: android-display
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: daymark-api
            target: api
          - image: daymark-oauth-broker
            target: oauth-broker
          - image: daymark-web
            target: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: daymark-android-display
          path: apps/web/public/downloads

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
